<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-labelledby="title desc"><title id="title">The Tilde workflow</title><desc id="desc">Parallel Herdr sessions feed a change-centered decision queue. Open an agent, review a change, or run checks. A passing receipt is verified for its fingerprint; editing code makes the receipt stale when the fingerprint refreshes. Re-run checks for new evidence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#b5ae9e" stroke-width="1.5"/></marker></defs><rect width="1100" height="710" rx="18" fill="#f3efe6"/><text x="48" y="55" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#625f54" text-anchor="start" font-weight="700">TILDE / THE WORKFLOW</text><text x="48" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#282a25" text-anchor="start" font-weight="400">Many agents. One next move.</text><text x="48" y="174" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#625f54" text-anchor="start" font-weight="400">HERDR SESSIONS</text><text x="520" y="174" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#625f54" text-anchor="middle" font-weight="400">ONE CARD PER CHANGE</text><text x="876" y="174" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#625f54" text-anchor="middle" font-weight="400">YOUR ACTION</text><rect x="48" y="219" width="190" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><circle cx="72" cy="245" r="5" fill="#647f67"/><text x="151.0" y="252" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Working</text><path d="M238 245H310C382 245 356 335 443 335" fill="none" stroke="#b5ae9e" stroke-width="2.5"/><rect x="48" y="309" width="190" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><circle cx="72" cy="335" r="5" fill="#dc532b"/><text x="151.0" y="342" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Blocked</text><path d="M238 335H310C382 335 356 335 443 335" fill="none" stroke="#b5ae9e" stroke-width="2.5"/><rect x="48" y="399" width="190" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><circle cx="72" cy="425" r="5" fill="#b18437"/><text x="151.0" y="432" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Ready</text><path d="M238 425H310C382 425 356 335 443 335" fill="none" stroke="#b5ae9e" stroke-width="2.5"/><path d="M423 335H446" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="520" cy="335" r="62" fill="#dc532b"/><path d="M492 335C504 305 514 365 527 335S546 327 550 335" fill="none" stroke="#fff7eb" stroke-width="8" stroke-linecap="round"/><text x="520" y="431" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#282a25" text-anchor="middle" font-weight="700">Needs you</text><path d="M586 335H650" fill="none" stroke="#b5ae9e" stroke-width="2.5"/><path d="M650 335C706 335 688 245 758 245" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="770" y="219" width="212" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><text x="876.0" y="252" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Open agent</text><path d="M650 335C706 335 688 335 758 335" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="770" y="309" width="212" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><text x="876.0" y="342" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Review</text><path d="M650 335C706 335 688 425 758 425" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="770" y="399" width="212" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><text x="876.0" y="432" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Run checks</text><path d="M876 451V492H884V537" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M48 488H730" stroke="#ccc6b9"/><text x="48" y="523" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#625f54" text-anchor="start" font-weight="400">EVIDENCE FOLLOWS THE CODE</text><rect x="764" y="550" width="235" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><circle cx="788" cy="576" r="5" fill="#416345"/><text x="889.5" y="583" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Verified</text><rect x="431" y="550" width="213" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><text x="537.5" y="583" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Code changes</text><rect x="105" y="550" width="210" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><circle cx="129" cy="576" r="5" fill="#dc532b"/><text x="218.0" y="583" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Stale</text><path d="M764 576H656" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M431 576H327" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M209 605V657H884V605" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="545" y="647" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#625f54" text-anchor="middle" font-weight="400">Re-run checks · new fingerprint</text></svg>