<svg xmlns="http://www.w3.org/2000/svg" width="760" height="516" viewBox="0 0 760 516" role="img" aria-labelledby="title desc">
<title id="title">Tilde decision card — illustrated example</title>
<desc id="desc">The storefront change on branch feature/hud needs attention because its checks and CI failed. Run Checks is the primary action; Review, Open Agent, and Open PR are secondary actions.</desc>
<rect x="1" y="1" width="758" height="514" rx="28" fill="#20211f" stroke="#3a3c36" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="34" y="32" width="149" height="40" rx="20" fill="#4b2627"/>
<circle cx="55" cy="52" r="4" fill="#ff6469"/>
<text x="72" y="59" fill="#ff777b" font-size="21" font-weight="700">Needs you</text>
<text x="724" y="59" text-anchor="end" fill="#b8bab2" font-size="20">Checks failed</text>
<text x="36" y="126" fill="#f6f5ed" font-size="32" font-weight="700">storefront</text>
<text x="36" y="161" fill="#afb2a7" font-size="20" font-family="Menlo, Consolas, monospace">feature/hud</text>
<path d="M36 190H724" stroke="#3b3d37"/>
<g fill="#ff6469" font-size="25" font-weight="700"><text x="40" y="235">!</text><text x="40" y="275">!</text></g>
<circle cx="44" cy="308" r="3" fill="#a2a69a"/>
<g font-size="22"><text x="65" y="234" fill="#f0f1e9">Checks failed for this exact change</text><text x="65" y="274" fill="#f0f1e9">CI failed for this commit</text><text x="65" y="315" fill="#b8bcb0">3 files changed versus main</text></g>
<rect x="34" y="349" width="692" height="61" rx="14" fill="#ff3346"/>
<text x="380" y="388" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">Run Checks</text>
<g fill="#32352f"><rect x="34" y="429" width="220" height="52" rx="12"/><rect x="270" y="429" width="220" height="52" rx="12"/><rect x="506" y="429" width="220" height="52" rx="12"/></g>
<g fill="#e8ebe0" font-size="20" font-weight="600" text-anchor="middle"><text x="144" y="462">Review</text><text x="380" y="462">Open Agent</text><text x="616" y="462">Open PR</text></g>
</g>
</svg>
