<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1120" viewBox="0 0 600 1120" role="img" aria-labelledby="title desc"><title id="title">The Tilde workflow</title><desc id="desc">Parallel Herdr sessions feed a change-centered decision queue. Open an agent, review a change, or run checks. A passing receipt is verified for its fingerprint; editing code makes the receipt stale when the fingerprint refreshes. Re-run checks for new evidence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#b5ae9e" stroke-width="1.5"/></marker></defs><rect width="600" height="1120" rx="18" fill="#f3efe6"/><text x="32" y="49" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#625f54" text-anchor="start" font-weight="700">TILDE / THE WORKFLOW</text><text x="32" y="111" font-family="Georgia, serif" font-size="48" fill="#282a25" text-anchor="start" font-weight="400">Many agents.</text><text x="32" y="166" font-family="Georgia, serif" font-size="48" fill="#282a25" text-anchor="start" font-weight="400">One next move.</text><text x="300" y="215" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#625f54" text-anchor="middle" font-weight="400">HERDR SESSIONS</text><rect x="25" y="245" width="170" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><circle cx="49" cy="271" r="5" fill="#647f67"/><text x="118.0" y="278" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Working</text><path d="M110 303V329Q110 352 300 352" fill="none" stroke="#b5ae9e" stroke-width="2.5"/><rect x="215" y="245" width="170" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><circle cx="239" cy="271" r="5" fill="#dc532b"/><text x="308.0" y="278" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Blocked</text><path d="M300 303V329Q300 352 300 352" fill="none" stroke="#b5ae9e" stroke-width="2.5"/><rect x="405" y="245" width="170" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><circle cx="429" cy="271" r="5" fill="#b18437"/><text x="498.0" y="278" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Ready</text><path d="M490 303V329Q490 352 300 352" fill="none" stroke="#b5ae9e" stroke-width="2.5"/><path d="M300 352V391" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="300" cy="461" r="62" fill="#dc532b"/><path d="M272 461C284 431 294 491 307 461S326 453 330 461" fill="none" stroke="#fff7eb" stroke-width="8" stroke-linecap="round"/><text x="300" y="555" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#282a25" text-anchor="middle" font-weight="700">Needs you</text><text x="300" y="588" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#625f54" text-anchor="middle" font-weight="400">One card per change</text><path d="M300 609V635" fill="none" stroke="#b5ae9e" stroke-width="2.5"/><path d="M300 635H110V674" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="25" y="685" width="170" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><text x="110.0" y="718" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Open agent</text><path d="M300 635H300V674" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="215" y="685" width="170" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><text x="300.0" y="718" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Review</text><path d="M300 635H490V674" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="405" y="685" width="170" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><text x="490.0" y="718" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Run checks</text><path d="M490 743V791H450V821" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M32 780H374" stroke="#ccc6b9"/><text x="32" y="815" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#625f54" text-anchor="start" font-weight="400">EXACT VERIFICATION</text><rect x="342" y="837" width="220" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><circle cx="366" cy="863" r="5" fill="#416345"/><text x="460.0" y="870" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Verified</text><rect x="40" y="837" width="220" height="52" rx="26" fill="#f3efe6" stroke="#b5ae9e" stroke-width="1.5"/><circle cx="64" cy="863" r="5" fill="#dc532b"/><text x="158.0" y="870" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#282a25" text-anchor="middle" font-weight="400">Stale</text><path d="M342 863H272" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="301" y="925" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#625f54" text-anchor="middle" font-weight="400">Code changes → receipt goes stale</text><path d="M150 895V983H452V895" fill="none" stroke="#b5ae9e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="300" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#282a25" text-anchor="middle" font-weight="700">Re-run checks</text><text x="300" y="1056" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#625f54" text-anchor="middle" font-weight="400">New fingerprint. New evidence.</text></svg>